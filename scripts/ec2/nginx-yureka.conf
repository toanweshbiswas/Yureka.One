# Yureka.One — reverse proxy to Node on :3000
# Hosts:
#   yureka.one / www.yureka.one  → landing
#   app.yureka.one               → product app
#   admin.yureka.one             → admin panel
#
# Temporary sslip.io permanently 301s to production hosts (cutover).

upstream yureka_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---- Temporary sslip.io → production (HTTP) ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 13-57-223-228.sslip.io _;

    location ~ ^/(login|join-waitlist|waiting|dashboard)(/|$) {
        return 301 https://app.yureka.one$request_uri;
    }
    location ^~ /admin {
        return 301 https://admin.yureka.one$request_uri;
    }
    location / {
        return 301 https://yureka.one$request_uri;
    }
}

# ---- Temporary sslip.io → production (HTTPS) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 13-57-223-228.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/13-57-223-228.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13-57-223-228.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/(login|join-waitlist|waiting|dashboard)(/|$) {
        return 301 https://app.yureka.one$request_uri;
    }
    location ^~ /admin {
        return 301 https://admin.yureka.one$request_uri;
    }
    location / {
        return 301 https://yureka.one$request_uri;
    }
}

# ---- Production hosts (HTTP) ----
server {
    listen 80;
    listen [::]:80;
    server_name yureka.one www.yureka.one app.yureka.one admin.yureka.one;

    client_max_body_size 20m;

    location / {
        proxy_pass http://yureka_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ---- Production TLS (placeholder origin cert for Cloudflare Full) ----
# certbot will replace these paths once real LE certs are issued.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yureka.one www.yureka.one app.yureka.one admin.yureka.one;

    ssl_certificate     /etc/ssl/yureka-origin/fullchain.pem;
    ssl_certificate_key /etc/ssl/yureka-origin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://yureka_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
