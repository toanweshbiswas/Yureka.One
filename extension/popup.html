<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Yureka</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <p class="kicker">Yureka</p>
          <h1 id="host">This store</h1>
        </div>
        <a id="open-app" class="ghost" href="#" target="_blank" rel="noreferrer">Open app</a>
      </header>
      <p id="status" class="status">Checking coupons…</p>
      <section id="goldback" class="list" hidden></section>
      <section id="market" class="list" hidden></section>
      <p id="empty" class="empty" hidden>No live coupons for this site yet. Open Yureka for the full marketplace.</p>
    </div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
