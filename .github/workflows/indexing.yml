name: Instant Search Indexing
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  google-indexing:
    name: Ping Google
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Google Indexing Action
        if: ${{ env.GCP_SA_KEY != '' }}
        # Pin to commit for v1.0.2 (not mutable tag) — supply-chain hardening
        uses: robingenz/action-google-indexing@fd276ac89cfb1c73ab82bd383f402e296fc9b9cf # v1.0.2
        with:
          siteUrl: 'https://yureka.one'
          gcpServiceAccountKey: ${{ secrets.GCP_SA_KEY }}
