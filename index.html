      var host = (location.hostname || '').toLowerCase();
      if (
        host === 'app.yureka.one' ||
        host === 'admin.yureka.one' ||
        host === 'brand.yureka.one'
      ) {
        return;
      }
      // Product shell on shared localhost / preview hosts
      var path = location.pathname || '';
      if (
        path.indexOf('/dashboard') === 0 ||
        path.indexOf('/login') === 0 ||
        path.indexOf('/admin') === 0 ||
        path.indexOf('/brand') === 0
      ) {
        return;
      }
      window.cId = '291471';
      var s = document.createElement('script');
      s.async = true;
